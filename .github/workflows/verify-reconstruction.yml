name: Verificar reconstrucción MOVETE
on:
  push:
    branches: [reconstruccion-limpia-2026-11-23]
  workflow_dispatch:
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis JavaScript
        run: |
          for file in *.js; do node --check "$file" || exit 1; done
      - name: Comprobar archivos y carga de módulos
        run: node tests/verify.mjs
